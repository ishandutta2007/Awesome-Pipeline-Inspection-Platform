<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#311b92;#1e293b" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="12" fill="url(#bgGrad)"/>
  <rect width="896" height="236" x="2" y="2" rx="10" fill="none" stroke="url(#textGrad)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Animated Pipeline Waves / Grid overlay -->
  <g opacity="0.15">
    <line x1="0" y1="40" x2="900" y2="40" stroke="#ffffff" stroke-dasharray="5 5"/>
    <line x1="0" y1="90" x2="900" y2="90" stroke="#ffffff" stroke-dasharray="5 5"/>
    <line x1="0" y1="140" x2="900" y2="140" stroke="#ffffff" stroke-dasharray="5 5"/>
    <line x1="0" y1="190" x2="900" y2="190" stroke="#ffffff" stroke-dasharray="5 5"/>
  </g>

  <!-- Dynamic Pipeline Line Path -->
  <path d="M 50 170 Q 200 60 350 140 T 650 90 T 850 130" fill="none" stroke="url(#lineGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Animated Glowing Nodes on Pipeline -->
  <circle cx="200" cy="98" r="6" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="350" cy="140" r="6" fill="#818cf8" filter="url(#glow)">
    <animate attributeName="r" values="6;10;6" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="90" r="6" fill="#c084fc" filter="url(#glow)">
    <animate attributeName="r" values="5;9;5" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- Main Banner Title -->
  <text x="450" y="105" text-anchor="middle" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" filter="url(#glow)">
    🔍 PIPELINE INSPECTION PLATFORMS
  </text>

  <!-- Subtitle -->
  <text x="450" y="145" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" letter-spacing="0.8">
    Curated SaaS Ecosystem • Revenue Intelligence • Deal Analytics • Forecast Accuracy
  </text>

  <!-- Pulsing Live Metric Pill -->
  <g transform="translate(365, 170)">
    <rect width="170" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <circle cx="20" cy="14" r="4" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
      Awesome Curator 2026
    </text>
  </g>
</svg>
